name: PR Preview Link

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  update-pr:
    name: Add preview URL to PR description
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Sanitize branch name
        id: branch
        run: |
          SANITIZED=$(echo "${{ github.head_ref }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          echo "name=$SANITIZED" >> $GITHUB_OUTPUT

      - name: Update PR description
        uses: actions/github-script@v7
        with:
          script: |
            const branch   = '${{ steps.branch.outputs.name }}';
            const project  = 'butik-test';
            const account  = '${{ vars.CF_ACCOUNT_SUBDOMAIN }}';
            const url      = `https://${branch}-${project}.${account}.workers.dev`;

            const marker = '<!-- cf-preview-url -->';
            const block  = `${marker}\n> 🚀 **Preview:** [${url}](${url})\n${marker}`;

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const body = pr.body || '';
            const updated = body.includes(marker)
              ? body.replace(new RegExp(`${marker}[\\s\\S]*?${marker}`), block)
              : `${body}\n\n${block}`.trimStart();

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.payload.pull_request.number,
              body: updated,
            });
